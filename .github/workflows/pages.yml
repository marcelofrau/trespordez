name: Build and deploy QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate content
        run: node scripts/validate-site.mjs
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build Jekyll QA site
        env:
          JEKYLL_ENV: qa
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --url "https://marcelofrau.github.io"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
