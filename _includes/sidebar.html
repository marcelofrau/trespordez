<aside class="sidebar">
  <section>
    <h2>Recentes</h2>
    <ul>{% for post in site.posts limit: 5 %}<li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>{% endfor %}</ul>
  </section>
  <section>
    <h2>Categorias</h2>
    <ul>{% for category in site.data.categories %}<li><a href="{{ category[1].url | relative_url }}">{{ category[1].name }}</a></li>{% endfor %}</ul>
  </section>
</aside>
